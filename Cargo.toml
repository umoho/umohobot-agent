[workspace]
members = [".", "contracts", "tools-telegram", "trigger-telegram", "telegram-host"]
resolver = "2"

[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
contracts = { path = "contracts" }
minijinja = "2"
rig = { package = "rig-core", version = "0.37.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
