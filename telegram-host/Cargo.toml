[package]
name = "telegram-host"
version = "0.1.0"
edition = "2024"

[dependencies]
agent = { path = ".." }
chrono = { version = "0.4", features = ["serde"] }
rig = { package = "rig-core", version = "0.37.0" }
teloxide = { version = "0.17", default-features = false, features = ["ctrlc_handler", "rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tools-telegram = { path = "../tools-telegram" }
trigger-telegram = { path = "../trigger-telegram" }
tracing = "0.1"
