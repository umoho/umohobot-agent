[package]
name = "tools-telegram"
version = "0.1.0"
edition = "2024"

[dependencies]
agent = { path = ".." }
contracts = { path = "../contracts" }
rig = { package = "rig-core", version = "0.37.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teloxide = { version = "0.17", default-features = false, features = ["ctrlc_handler", "rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
